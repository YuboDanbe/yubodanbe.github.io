<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Musigatari — Lista</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#FF9201">
<link rel="stylesheet" href="shared/fonts.css">
<link rel="stylesheet" href="shared/styles.css">
<script>
  (function () {
    try {
      var raw = localStorage.getItem('chordchart.library.v1');
      var theme = raw && JSON.parse(raw).ui && JSON.parse(raw).ui.theme;
      document.documentElement.dataset.theme = theme || 'dark';
    } catch (e) {}
  })();
</script>
</head>
<body>
  <div id="root"></div>

  <script src="config/config.js"></script>
  <script src="shared/react.js"></script>
  <script src="shared/react-dom.js"></script>
  <script src="shared/data.js"></script>
  <script src="shared/components.js"></script>
  <script src="shared/storage.js"></script>
  <script src="shared/page-shell.js"></script>
  <script src="lista.js"></script>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }
  </script>
</body>
</html>
